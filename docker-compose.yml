version: "3.8"

services:
  web:
    build: .
    image: idc-cabling-recovery:latest
    container_name: idc-recovery-web
    # 同时映射 8000 与 Flask 习惯的 5000 端口，宿主机访问任一即可
    ports:
      - "8000:8000"
      - "5000:8000"
    environment:
      # 生产使用时请在 shell / .env 中覆盖 SECRET_KEY
      SECRET_KEY: ${SECRET_KEY:-idc-recovery-dev-secret-key-change-me}
      AUTO_SEED: ${AUTO_SEED:-1}
      LIVE_DB: /app/data/live.db
      BACKUP_DB: /app/data/backup.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
